name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: bash native-notifier/build.sh
      - run: MoshdropNotifier.app/Contents/MacOS/MoshdropNotifier --selftest
      - run: go vet ./...
      - run: go test ./... -timeout 300s
        env:
          MOSHDROP_E2E: "0"
          MOSHDROP_MUTE_NOTIFY: "1"
          MOSHDROP_TEST_NOTIFIER: ${{ github.workspace }}/MoshdropNotifier.app/Contents/MacOS/MoshdropNotifier
      - name: Validate release packaging without publishing
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.3
          args: release --snapshot --skip=publish --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ""
      - run: bash native-notifier/verify-archives.sh
